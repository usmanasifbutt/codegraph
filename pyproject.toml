[project]
name = "codegraph"
version = "0.1.0"
description = "Deterministic code graph of a Python repo in Neo4j, queried by an LLM agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=6.3.1",
    "python-dotenv>=1.2.3",
    "typer>=0.27.2",
]

[project.scripts]
codegraph = "codegraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", ".*"]
markers = ["neo4j: integration test that needs a reachable Neo4j (NEO4J_URI)"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
