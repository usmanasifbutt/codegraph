# Run with: docker compose up -d   (or: podman compose up -d)
# Config comes from .env (copy .env.example). No secrets live in this file.
name: codegraph

services:
  neo4j:
    image: docker.io/library/neo4j:5.26-community
    ports:
      - "7474:7474" # browser
      - "7687:7687" # bolt
    environment:
      # The image maps every NEO4J_* variable to a config setting, so only official keys go here.
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: Containerfile
    image: localhost/codegraph-app:latest
    depends_on:
      neo4j:
        condition: service_healthy
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      # The UI offers folders under the read-only mount; clones go to the workspace volume.
      CODEGRAPH_REPOS_ROOT: /repos
      CODEGRAPH_WORKSPACE: /workspace
      HF_HOME: /cache/huggingface
    ports:
      # Loopback only: the UI has no authentication.
      - "127.0.0.1:8501:8501"
    volumes:
      # Repositories to connect, read-only. Point REPO_PATH at a parent folder (e.g. D:/Projects)
      # to pick any project under it from the UI. See README for Windows path forms.
      - ${REPO_PATH:-./}:/repos:ro
      - workspace:/workspace
      - model-cache:/cache/huggingface
    command: ["codegraph", "ui", "--address", "0.0.0.0", "--port", "8501"]

volumes:
  neo4j-data:
  workspace:
  model-cache:
